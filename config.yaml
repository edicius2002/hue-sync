# Configuracion del MVP. Todo lo ajustable vive aqui; las credenciales del
# bridge van aparte en hue_config.json y nunca en el codigo.

audio:
  # Bloque de captura. 256 @ 48 kHz = 5.3 ms de latencia de captura.
  blocksize: 256
  buffer_seconds: 10.0
  # Subcadena del nombre del dispositivo, p.ej. "JBL Charge 6".
  # Preferible al indice: los indices de WASAPI se renumeran solos en cuanto
  # conectas o desconectas cualquier dispositivo de audio.
  device_name: null
  # Tiene prioridad sobre device_name. null y sin nombre = el del sistema.
  device_index: null

analysis:
  fft_size: 1024
  hop: 256                 # 187.5 frames/s a 48 kHz

  # Limites del espectro por banda, en Hz.
  band_edges:
    - [20.0, 250.0]        # graves
    - [250.0, 2000.0]      # medios
    - [2000.0, 16000.0]    # agudos

  # El tempo se sigue sobre todo con graves: bombo y caja marcan el pulso,
  # los hi-hats marcan corcheas y confunden al detector.
  low_cutoff_hz: 500.0
  tempo_low_weight: 1.0
  tempo_full_weight: 0.3

  min_bpm: 60.0
  max_bpm: 180.0
  # Centro y ancho (en octavas) del prior que desempata errores de octava.
  prior_bpm: 120.0
  prior_width: 0.9
  history_seconds: 6.0
  estimate_interval: 0.5
  # Debe cubrir varios beats: cerca de un periodo de beat actua como notch
  # en la frecuencia del pulso.
  smoothing_seconds: 1.5

  # Multiplos del lag que refuerzan un candidato. El 3 distingue el pulso real
  # de un candidato a 1.5x (para el real todos los multiplos correlacionan;
  # para uno a 1.5x solo los pares).
  harmonics:
    - [2, 0.5]
    - [3, 0.35]
    - [4, 0.25]

  # Ganancias del PLL. Mas alto = corrige antes pero sigue mas el ruido.
  phase_gain: 0.45
  period_gain: 0.12
  # Medido sobre musica real: los pasajes turbios bajan a ~0.29 de confianza,
  # asi que un umbral de 0.25 no dejaba margen. A partir de full_confidence el
  # PLL corrige con la ganancia completa.
  min_confidence: 0.15
  full_confidence: 0.6

  band_peak_decay: 0.5     # factor por segundo del seguidor de pico
  band_attack: 0.005
  band_release: 0.15

  silence_rms: 0.0001
  silence_timeout: 2.0

  # Onsets: golpes sueltos que no caen en el pulso (redobles, stabs, palmas a
  # contratiempo). La ODF ya los veia, solo se usaba para el tempo.
  onset_window: 0.15
  # Calibrado con ground truth de impulsos: a 3.5 da 100% de aciertos y 0% de
  # falsos incluso con ruido, y en musica real detecta 3.7 golpes/s contra los
  # 3.9 teoricos de hi-hats en corcheas a 117 BPM.
  onset_delta: 3.5
  onset_lookahead: 3          # ~16 ms de latencia de confirmacion
  onset_min_separation: 0.05
  # Cuanto tiene que alejarse del pulso, en fracciones de beat, para contar
  # como fuera de tiempo. Los que caen en el beat ya los cubre la envolvente.
  onset_offbeat_margin: 0.15

  # Sostenimiento: CV de la energia RMS cruda en una ventana temporal. La
  # ventana 0.20..0.43 cubre 87.9% de summer.wav y 0% de billie.wav; se deja
  # visible para contrastarla con mas material real antes de darla por final.
  sustain_window: 2.5
  sustain_transition: 0.75
  sustain_energy_full: 0.20
  sustain_energy_zero: 0.43

  # Chroma: reparto de energia entre las 12 clases de altura, para que el color
  # siga la armonia en vez del timbre. FFT propio y mucho mayor que el de la
  # ODF: con 1024 los semitonos solo se resuelven por encima de 788 Hz, o sea
  # que no sirve para las fundamentales. Con 8192 se resuelven desde 99 Hz.
  chroma_fft_size: 8192
  chroma_hop: 2048
  chroma_fmin: 100.0
  chroma_fmax: 2000.0        # por encima dominan armonicos de OTRA clase
  chroma_smoothing: 0.93
  chroma_tonality_smoothing: 0.97   # mas fuerte: gobierna la mezcla de color
  # Acumular solo los maximos locales del espectro. En mezcla completa la
  # bateria aplana el chroma; quedarse con los picos sube la separacion entre
  # musica y ruido de 3.9x a 8.8x.
  chroma_peaks_only: true

  # Seguimiento del compas. La energia de graves de cada beat se acumula en un
  # histograma modulo beats_per_bar; el maximo es el "1".
  beats_per_bar: 4
  beats_per_phrase: 16
  downbeat_decay: 0.97        # bajo = se readapta rapido pero mas inestable
  # Calibrado sobre musica REAL, no sintetica. La histeresis no es opcional:
  # medido en vivo la confianza oscila entre 0.03 y 0.27 sobre el mismo tema,
  # asi que con un solo umbral la feature entra y sale cada pocos segundos y el
  # "1" salta de sitio. Con dos umbrales y offset_hold: 13 cambios de posicion
  # -> 0.
  downbeat_min_confidence: 0.14     # engancha
  downbeat_unlock_confidence: 0.07  # suelta
  downbeat_offset_hold: 8           # compases antes de mover el "1"

effects:
  mode: combo              # combo | harmony | bars | beat_flash | spectrum | sustain | roles | idle

  # El brillo sube durante esta fraccion del beat ANTES del golpe. Es lo que
  # convierte el efecto en algo que se anticipa al ritmo en vez de reaccionar,
  # y solo es posible porque el BeatClock predice el proximo beat.
  beat_attack: 0.08
  beat_decay: 4.0          # caida tras el golpe, en unidades de 1/beat
  beat_floor: 0.12         # brillo entre golpes; a 0 parpadea agresivo

  # Mapeo frecuencia -> color.
  bass_color: [1.0, 0.12, 0.0]
  mid_color: [0.1, 1.0, 0.25]
  treble_color: [0.25, 0.45, 1.0]

  # Reposo cuando no suena nada: tenue y fijo, nunca apagado.
  idle_color: [1.0, 0.55, 0.2]
  idle_brightness: 0.07

  # Modo `roles`: un rol por canal, en orden de insercion del area. No son
  # posiciones geometricas: identifica cada luz a ojo antes de asignarla.
  # pulso=combo, armonia=harmony, espectro=spectrum, sostenido=sustain.
  channel_roles: [pulso, armonia]

  # Cuanto mas brillante es el "1" del compas. A 0 todos los beats pesan igual,
  # que es lo que hacia que el efecto pareciera sincronizado pero no musical.
  downbeat_accent: 0.35

  # Un color por compas dentro de la frase, para el modo `bars`.
  phrase_palette:
    - [1.0, 0.15, 0.05]
    - [1.0, 0.55, 0.0]
    - [0.15, 0.9, 0.4]
    - [0.2, 0.35, 1.0]

  # Golpe de brillo extra en los onsets fuera de tiempo. Aditivo sobre la
  # envolvente del beat, no la sustituye.
  # Cualquier valor de este fichero se puede pisar desde el entorno con
  # HUEBPM_<SECCION>_<CAMPO>, p.ej. HUEBPM_EFFECTS_ONSET_ACCENT=0.5
  onset_accent: 0.5
  # Cuanto blanquea el color el golpe. Es lo que de verdad lo hace visible con
  # una sola luz: subir solo el brillo apenas se percibe porque cerca de un
  # beat la envolvente ya esta alta y el acento se satura sin cambiar nada.
  onset_flash: 0.75
  onset_decay: 0.13

  # Modo `harmony`: por debajo de min no hay armonia que seguir y el color sale
  # del espectro; por encima de full es armonia pura. Entre medias se mezcla
  # progresivamente, porque un corte seco produce un fogonazo al cruzarlo.
  # Calibrado sobre material real: una progresion tonal limpia da 0.37 de
  # tonalidad y una mezcla de pop o house se queda en 0.03-0.04, apenas por
  # encima del 0.008 del ruido. Por debajo del minimo el modo se aparta y deja
  # el color espectral, que al menos responde a algo real.
  harmony_min_tonality: 0.08
  harmony_full_tonality: 0.20
  harmony_saturation: 0.9
  # Cuanto modula el beat el brillo en `harmony`. Mucho mas bajo que en los
  # otros modos a proposito: si la luz pulsa igual de fuerte, el pulso domina y
  # el color pasa desapercibido, o sea que `harmony` y `combo` se ven iguales.
  # Cero = brillo constante, solo cambia el color. Cualquier bajada entre
  # cambios de color se percibe como un apagado, no como parte de la musica.
  # Subelo si lo quieres con pulso; la pendiente se acota sola segun el tempo.
  harmony_beat_depth: 0.0
  harmony_max_step: 0.03    # cambio maximo de brillo por frame de render

  # Modo `sustain`: mezcla gradualmente el destello del beat con una respiracion
  # suave cuando coinciden envolvente estable y tonalidad. Se calibra separado
  # de `harmony`: aqui la tonalidad decide el brillo, no el color.
  #
  # Calibrado sobre summer.wav y billie.wav, no sobre sintetico. La rampa del
  # sostenimiento va 0.55..0.95 porque en material real el detector vive entre
  # 0.63 y 0.99: con la 0.35/0.65 provisional la mitad de las filas saturaban
  # y la curva era una meseta. Resultado: mezcla activa 60.1% del tiempo en
  # summer, 0.0% en billie (percusiva, es la respuesta correcta).
  sustain_min: 0.55
  sustain_full: 0.95
  # La puerta tonal veta el sostenido SIN armonia (aplausos, hiss, vinilo).
  # El minimo NO se toca: el maximo medido sobre ruido de banda ancha es
  # 0.0228 (rosa, peor de 10 generaciones), asi que 0.03 deja solo 1.3x de
  # margen. El techo baja a 0.045 para que la puerta sature durante el tramo
  # sostenido y vuelva a ser un veto en vez de la senal que modula el brillo.
  sustain_min_tonality: 0.03
  sustain_full_tonality: 0.045
  sustain_max_step: 0.03    # limite de cambio de brillo por frame

  saturation_boost: 1.15   # las luces Hue lavan los tonos mezclados

render:
  fps: 50.0
  # Cuanto ANTES del beat se emite el comando, para cubrir analisis + DTLS +
  # el salto Zigbee del bridge. Se calibra contra las luces reales.
  latency_compensation_ms: 120.0
