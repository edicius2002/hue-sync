[project]
name = "huebpm"
version = "0.1.0"
description = "Sincronizador de luces Philips Hue con deteccion de BPM en tiempo real"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Evita tener que instalar el paquete para testear.
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".ccb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501: el limite de linea lo controla el formateo, no el linter.
ignore = ["E501"]
